[workspace]
resolver = "3"
members = ["crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[workspace.dependencies]
dioxus = { version = "=0.7.10", default-features = false }
# oauth2 5.0이 reqwest 0.12에 의존하므로 같은 버전으로 맞춰 TLS 스택을 하나로 유지한다.
objc2 = "=0.6.5"
objc2-core-location = { version = "=0.3.2", default-features = false, features = ["std", "CLError", "CLLocation", "CLLocationManager", "CLLocationManagerDelegate"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSError", "NSObject", "NSString"] }
oauth2 = { version = "=5.0.0", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json"] }
rust-i18n = "=4.2.4"
security-framework = "=3.7.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["net", "io-util", "time", "rt", "sync"] }
url = "=2.5.8"
webbrowser = "=1.2.5"
